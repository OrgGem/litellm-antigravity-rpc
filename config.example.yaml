model_list:
  - model_name: antigravity
    litellm_params:
      model: antigravity_rpc/antigravity
      use_chat_completions_api: true
litellm_settings:
  callbacks:
    - proxy_handler.antigravity_rpc_responses_guard
  custom_provider_map:
    - provider: antigravity_rpc
      custom_handler: proxy_handler.antigravity_rpc_provider
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
router_settings:
  num_retries: 0
