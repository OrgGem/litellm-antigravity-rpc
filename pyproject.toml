[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "litellm-antigravity-rpc"
version = "0.2.0.dev0"
description = "OpenAI-compatible text gateway and LiteLLM provider for Antigravity ACP"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["litellm==1.109.0", "uvicorn>=0.34,<1"]

[project.scripts]
antigravity-rpc = "litellm_antigravity_rpc.cli:main"

[project.optional-dependencies]
proxy = ["litellm[proxy]==1.109.0"]
dev = ["build>=1,<2", "ruff>=0.14,<1", "pytest>=8,<10", "pytest-asyncio>=1,<2", "jsonschema==4.26.0"]
spike = ["litellm==1.109.0"]
v2 = ["jsonschema==4.26.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_antigravity_rpc"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
